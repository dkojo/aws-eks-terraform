# Layer 4: the workload. Two replicas spread over the nodes, exposed on NodePort 30080,
# which is what the load balancer's target group sends traffic to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-platform
spec:
  replicas: 2
  selector:
    matchLabels: { app: hello-platform }
  template:
    metadata:
      labels: { app: hello-platform }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: hello-platform }
      containers:
        - name: web
          image: public.ecr.aws/nginx/nginx:1.30-alpine
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /, port: 80 } }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: hello-platform
spec:
  type: NodePort
  selector: { app: hello-platform }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
